name: SoCreate Signed Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: 35

jobs:
  build-signed-release:
    name: Build Signed Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Make version bump script executable
        run: chmod +x .github/workflows/version-bump.sh

      # ─── Automatic Version Bump (on release) ───────────────────────────────
      - name: Bump versionCode and versionName
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: version
        run: .github/workflows/version-bump.sh

      # ─── Setup Signing Keystore (from GitHub Secrets) ─────────────────────
      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOCREATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/socreate-release.jks
            echo "✅ Keystore restored from secrets"
          else
            echo "⚠️ No keystore secret found — building debug only"
          fi

      - name: Create keystore.properties
        run: |
          if [ -f app/socreate-release.jks ]; then
            cat > keystore.properties << EOF
storeFile=app/socreate-release.jks
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyAlias=socreate
keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
EOF
            echo "✅ keystore.properties created"
          else
            echo "storeFile=" > keystore.properties
          fi

      # ─── Build Debug APK (always) ─────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ─── Build Signed Release (if keystore exists) ────────────────────────
      - name: Build Signed Release APK + AAB
        if: github.event.inputs.build_type != 'debug' && hashFiles('app/socreate-release.jks') != ''
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          echo "✅ Signed release build completed"

      # ─── Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socreate-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Upload Signed Release APK
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: socreate-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Signed Release AAB
        if: hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: socreate-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # ─── Create GitHub Release (on tag or manual) ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: SoCreate ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 📦 SoCreate Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "| Signed Release APK | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "| Signed Release AAB | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for Samsung Galaxy Tab S10+ & Google Play Store" >> $GITHUB_STEP_SUMMARY